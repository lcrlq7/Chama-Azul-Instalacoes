<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D2B4E" />
    <title>%TITULO%</title>
    <meta name="description" content="%DESCRICAO%" />
    <link rel="canonical" href="%URL%" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="%NOME%" />
    <meta property="og:title" content="%TITULO%" />
    <meta property="og:description" content="%DESCRICAO%" />
    <meta property="og:url" content="%URL%" />
    <meta property="og:image" content="%URL%og-chama-azul.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo da %NOME% ao lado de uma instalação hidráulica" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%TITULO%" />
    <meta name="twitter:description" content="%DESCRICAO%" />
    <meta name="twitter:image" content="%URL%og-chama-azul.jpg" />

    <script type="application/ld+json">
      %JSONLD%
    </script>

    <!-- Abertura: a chama nasce laranja e vira azul (queima correta). Só CSS: aparece antes do
         JavaScript, some sozinha em ~1,6 s, uma vez por sessão, e é desligada em "reduzir movimento". -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b1b34;
        animation: intro-sai 0.45s ease 1.25s forwards;
        cursor: pointer;
      }
      #intro svg {
        width: min(60vw, 240px);
        height: auto;
        overflow: visible;
      }
      #intro .arco {
        stroke-dasharray: 2200;
        stroke-dashoffset: 2200;
        animation: intro-arco 0.9s cubic-bezier(0.6, 0, 0.3, 1) 0.2s forwards;
      }
      #intro .chama {
        transform-origin: 540px 575px;
        transform-box: view-box;
        animation:
          intro-acende 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3) both,
          intro-tremula 0.5s ease-in-out 0.35s 2 alternate;
      }
      #intro .laranja {
        animation: intro-some 0.55s ease 0.45s forwards;
      }
      #intro .azul {
        opacity: 0;
        animation: intro-aparece 0.55s ease 0.45s forwards;
      }
      #intro .nome {
        font:
          600 15px/1 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: 0.32em;
        color: #fff;
        opacity: 0;
        animation: intro-aparece 0.5s ease 0.55s forwards;
      }
      @keyframes intro-arco {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes intro-acende {
        from {
          transform: scale(0.3);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes intro-tremula {
        to {
          transform: scale(0.97, 1.04);
        }
      }
      @keyframes intro-some {
        to {
          opacity: 0;
        }
      }
      @keyframes intro-aparece {
        to {
          opacity: 1;
        }
      }
      @keyframes intro-sai {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      .sem-intro #intro {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #intro {
          display: none;
        }
      }
    </style>
    <script>
      try {
        if (sessionStorage.getItem('intro-chama'))
          document.documentElement.classList.add('sem-intro');
        else sessionStorage.setItem('intro-chama', '1');
      } catch (e) {
        /* sem armazenamento: mostra a abertura normalmente */
      }
    </script>
  </head>
  <body>
    <div id="intro" aria-hidden="true" onclick="this.remove()">
      <svg viewBox="100 100 880 880">
        <defs>
          <linearGradient id="intro-g-laranja" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFD27A" />
            <stop offset="0.5" stop-color="#F4780B" />
            <stop offset="1" stop-color="#C2410C" />
          </linearGradient>
          <linearGradient id="intro-g-azul" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#BFF1FF" />
            <stop offset="0.45" stop-color="#6CCCFF" />
            <stop offset="1" stop-color="#1A85D6" />
          </linearGradient>
        </defs>
        <path
          class="arco"
          d="M858 292A405 405 0 1 0 858 788"
          fill="none"
          stroke="#6CCCFF"
          stroke-width="30"
          stroke-linecap="round"
        />
        <g class="chama">
          <path
            class="laranja"
            d="M540 310C580 370 628 420 628 475C628 535 588 575 540 575C492 575 452 535 452 475C452 435 475 405 498 388C500 410 515 432 538 440C522 400 525 350 540 310Z"
            fill="url(#intro-g-laranja)"
          />
          <path
            class="azul"
            d="M540 310C580 370 628 420 628 475C628 535 588 575 540 575C492 575 452 535 452 475C452 435 475 405 498 388C500 410 515 432 538 440C522 400 525 350 540 310Z"
            fill="url(#intro-g-azul)"
          />
          <path
            d="M540 310C580 370 628 420 628 475C628 535 588 575 540 575C492 575 452 535 452 475C452 435 475 405 498 388C500 410 515 432 538 440C522 400 525 350 540 310Z"
            fill="none"
            stroke="#fff"
            stroke-width="22"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <span class="nome">CHAMA AZUL</span>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui">
        %NOME%. WhatsApp e telefone: %TELEFONE%. E-mail: %EMAIL%.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
