# Configuração da Netlify: ao importar o repositório, ela já lê daqui
# o comando de build e a pasta publicada. Não precisa preencher nada no painel.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Arquivos do build com hash no nome (JS/CSS): podem ficar em cache por 1 ano.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotos e ícones: cache de 30 dias (mudam pouco, mas não têm hash no nome).
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Segurança básica para todas as páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
